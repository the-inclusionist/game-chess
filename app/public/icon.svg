<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Xadrez">
  <!--
    SPDX-License-Identifier: AGPL-3.0-or-later

    The install icon. Deliberately a BOARD and not a piece: the Hartwig set's drawing is still
    under the public-domain review recorded in docs/LICENSES.md (he died in 1956, so Brazil's
    term ends in 2027), and an app icon is the last place to spend a claim that is not settled
    yet. Alternating squares are geometry nobody owns.

    Palette from app/css/board.css, so the icon reads as the same product: --page behind,
    --surface-high for the light squares, --accent on the one square that marks a move.
  -->
  <rect width="64" height="64" fill="#05070f"/>
  <g fill="#24344a">
    <rect x="8"  y="8"  width="12" height="12"/>
    <rect x="32" y="8"  width="12" height="12"/>
    <rect x="20" y="20" width="12" height="12"/>
    <rect x="44" y="20" width="12" height="12"/>
    <rect x="8"  y="32" width="12" height="12"/>
    <rect x="32" y="32" width="12" height="12"/>
    <rect x="20" y="44" width="12" height="12"/>
    <rect x="44" y="44" width="12" height="12"/>
  </g>
  <rect x="44" y="8" width="12" height="12" fill="#FFB300"/>
</svg>
