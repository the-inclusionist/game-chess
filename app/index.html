<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez de Hartwig</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #05070f;
    color: #c9d1d9;
    font: 14px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /*
   * The engine's ui/layout measures THIS element and sizes #game-region from it, locking the
   * scale to whole PHYSICAL pixels so scanlines stay regular at any device pixel ratio.
   */
  #stage-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The region the engine listens to. Keyboard is bound HERE, never on window. */
  #game-region {
    position: relative;
    outline-offset: 4px;
  }
  #game-region:focus-visible { outline: 3px solid #FFD97D; }

  /*
   * The canvas fills whatever ui/layout sized #game-region to. Setting a width here WITHOUT a
   * matching height is what stretched the board: `max-width: 100vw` clipped the width to 721px
   * while the height stayed 720, giving 2.25x across and 4x down.
   */
  #board-canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    touch-action: none;   /* the camera owns the drag */
    cursor: grab;
  }
  #board-canvas:active { cursor: grabbing; }

  /*
   * The panel sits over the column the board leaves clear: 88 of the 320 logical pixels, which
   * is 27.5% however the region is scaled. Sizes come from the engine's own --ui-fs and --tap,
   * so the HUD grows with the board instead of drifting away from it.
   */
  .hud {
    position: absolute;
    inset: 0 0 0 auto;
    width: 27.5%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: calc(var(--ui-fs, 16px) * 0.35);
    padding: calc(var(--ui-fs, 16px) * 0.3);
    font-size: var(--ui-fs, 16px);
    line-height: 1.25;
    color: #c9d1d9;
    background: #111a24;
    border-left: 1px solid #2b3a4a;

    /* ========================= THE PANEL SCROLLS =========================
       It used to be `overflow: hidden`, on the assumption that the move list was the only thing
       that could grow and that giving IT a scrollbar was enough. Both halves were wrong: the
       controls below the list are taller than the column at the k=2 floor whatever the list does,
       so the outline switch was already clipped on an empty board — and once the list started
       filling, it pushed the difficulty select out of reach as well. Losing a menu because you
       played twenty moves is a bug, not a layout. */
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .hud h2 {
    margin: 0; font-size: 0.75em; font-weight: 600;
    color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .hud p { margin: 0; }
  .hud-turn { display: flex; align-items: center; gap: 0.4em; font-weight: 600; }
  .hud-swatch { flex: 0 0 auto; width: 0.8em; height: 0.8em; border: 1px solid #0b0f14; }
  .hud-swatch[data-side="w"] { background: #FFD97D; }
  .hud-swatch[data-side="b"] { background: #3F2B78; }
  .hud-captured { min-height: 1.2em; font-size: 1.05em; letter-spacing: -0.04em; }
  /* Bounded rather than greedy: `flex: 1 1 auto` let the score sheet claim the column and press
     everything under it against the bottom edge. A fixed window of about eight lines keeps the
     recent moves in view and leaves the controls where the player last saw them; the rest of the
     game is one scroll away, inside the list. */
  .hud-moves {
    flex: 0 0 auto; max-height: 8.5em; overflow-y: auto; overscroll-behavior: contain;
    margin: 0; padding-left: 1.7em; font-size: 0.9em;
    font-variant-numeric: tabular-nums;
  }
  .hud-moves:focus-visible { outline: 2px solid #FFD97D; outline-offset: 1px; }

  /* Two targets side by side in an 88-logical-pixel column: --tap keeps each at 44 CSS px tall
     (WCAG 2.5.5) and they split the width, which is the one dimension there is none of. */
  .hud-nav { display: flex; gap: 0.3em; }
  .hud-nav button {
    flex: 1 1 0; min-width: 0; min-height: var(--tap, 44px);
    display: flex; align-items: center; justify-content: center; gap: 0.2em;
    font: inherit; font-size: 0.75em;
    color: #c9d1d9; background: #1b2733;
    border: 1px solid #2b3a4a; border-radius: 2px;
    cursor: pointer;
  }
  .hud-nav button:hover:not(:disabled) { background: #24344a; }
  .hud-nav button:disabled { opacity: 0.45; cursor: default; }
  .hud-nav-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hud label { display: block; font-size: 0.75em; color: #8b949e; }
  /* --tap is 22*k, which is 44px at the k=2 floor: the WCAG 2.5.5 target size, inherited. */
  /* --tap is 22*k, which is 44px at the k=2 floor: the WCAG 2.5.5 target size, inherited.
     The font shrinks but the TARGET does not — "Correção deuteranopia" has to fit in 176px
     without the control becoming harder to hit. */
  .hud select {
    width: 100%; min-height: var(--tap, 44px);
    font: inherit; font-size: 0.8em;
    text-overflow: ellipsis;
  }

  .hud-check { display: inline; font-size: 0.8em; color: #c9d1d9; margin-left: 0.4em; }
  .hud input[type="checkbox"] {
    width: calc(var(--tap, 44px) * 0.4); height: calc(var(--tap, 44px) * 0.4);
    vertical-align: middle; accent-color: #FFD97D;
  }

  /* The panel switches with the board: same surface, same eye. */
  #game-region[data-contrast="high"] .hud {
    background: #000000; color: #FFFFFF; border-left-color: #FFFFFF;
  }
  #game-region[data-contrast="high"] .hud h2,
  #game-region[data-contrast="high"] .hud label { color: #FFFFFF; }
  #game-region[data-contrast="high"] .hud-nav button {
    color: #FFFFFF; background: #000000; border-color: #FFFFFF;
  }
  #game-region[data-contrast="high"] .hud-swatch[data-side="w"] { background: #FFFFFF; }
  #game-region[data-contrast="high"] .hud-swatch[data-side="b"] { background: #000000; border-color: #FFFFFF; }

  /*
   * The board coordinates. Real DOM text over the canvas, because Zdog has no text primitive —
   * see ui/coordinates.ts for why that is a gain rather than a workaround.
   *
   * `pointer-events: none` matters: the letters sit ON the board, and the board is dragged to turn
   * the camera. A label that swallowed a pointerdown would put a dead spot on the very edge a
   * player reaches for.
   */
  .coords {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-size: calc(var(--ui-fs, 16px) * 0.62);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #6f6552;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  }
  .coords-label {
    position: absolute;
    top: 0;
    left: 0;
    line-height: 1;
    will-change: transform;
  }
  #game-region[data-contrast="high"] .coords { color: #FFFFFF; text-shadow: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  kbd { font: inherit; border: 1px solid #30363d; border-radius: 3px; padding: 0 4px; }
  p.hint { color: #6e7681; margin: 0; padding: 10px; text-align: center; font-size: 12px; flex: 0 0 auto; }
</style>
</head>
<body>

<!-- MARCACAO EXIGIDA by createGame: #game-region, #sr-status, #sr-alert.
     Anything missing does not throw — it becomes an entry in engine.problems. -->
<div id="stage-wrap">
  <div id="game-region" tabindex="0"></div>
</div>

<p class="hint">
  Setas navegam o tabuleiro &middot; Enter seleciona &middot; <kbd>K</kbd> sonar &middot;
  arraste ou Shift + setas gira a c&acirc;mera
</p>

<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="sr-alert"  class="sr-only" role="alert"  aria-live="assertive"></div>

<!-- Empty host where installCvdFilters builds the six colour-vision filters at runtime. -->
<svg id="cvd" class="sr-only" aria-hidden="true"></svg>

<script type="module" src="./js/boot/main.ts"></script>
</body>
</html>
