<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ========================= NOTO COLOR EMOJI, FOR THE FLAGS =========================
  The Dev, 2026-10-04, pointing at https://fonts.google.com/noto/specimen/Noto+Color+Emoji after
  being told the countries list would carry no flags.

  He is right that this is the answer, and the reason the flags were refused is worth keeping:
  WINDOWS SHIPS NO COUNTRY-FLAG GLYPHS. Segoe UI Emoji has every other emoji and not these, so a
  flag draws as its two letters in a box — on the Dev's own machine. Noto Color Emoji has them.

  WARNING: A REMOTE STYLESHEET IN AN OFFLINE-FIRST PWA, and the trade is stated rather than
  hidden. The font is megabytes — self-hosting it would be most of this game's download, for three
  flags — so it is fetched from Google and the page does not wait for it: `display=swap` means the
  names render at once in whatever the system has, and the flags appear when the font lands. With
  no network the list still works and the three flags fall back to their letters, which is exactly
  where this started. Nothing else on the page depends on it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<!--
  ⚠️ `<base href="/" />` NEEDED BY WAVE «Publicar» (ADR-0117, 2026-10-02): the platform serves
  this game under `o-inclusionista.jrocha.dev.br/game-chess/`, but the shared R2 proxy for the
  engine's heavy files lives at the DOMAIN ROOT at `/heavy/*`. Without an explicit `<base>`,
  `document.baseURI` would be `.../game-chess/`, and the engine's `new URL('heavy/...', baseURI)`
  resolves to `.../game-chess/heavy/...` — one route 404s per heavy file. With `base='/'`, the
  same code resolves to `/heavy/...` on the root and finds the proxy. Relative asset `href`s in
  this file (CSS, JS) still land under the subpath because Vite rewrites them at build time;
  base only shifts what `new URL(..., baseURI)` resolves against in runtime.
-->
<base href="/" />
<title>Xadrez de Hartwig</title>
<link rel="stylesheet" href="./css/board.css">
<style>
  /*
   * ⚠️ ONLY THE TITLE SCREEN IS INLINE, AND THAT IS THE POINT OF IT. The rest of this page's CSS
   * lives in `css/board.css`, linked in the head — but the splash has to paint on the FIRST FRAME,
   * because the opponent behind it is a 6.98 MB download and a stylesheet is a second request. A
   * title screen that arrived late would show the board first, which is the lie it exists to avoid.
   */
  /*
   * ========================= THE TITLE SCREEN =========================
   * Over everything, including the page's own chrome, because until START there is nothing behind
   * it worth reaching. `#chess-board` carries `inert` for the same reason: a board that cannot be
   * played should not be reachable by Tab either.
   *
   * The type is `clamp`ed rather than fixed so the name is large on a projector and still fits a
   * phone held sideways — and it is the one place in this game where something is large for the
   * sake of being large, which is what a title is for.
   */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.35em;
    background: #0d1117;
    color: #e6edf3;
    text-align: center;
    padding: 5vmin;
  }
  #splash-title {
    margin: 0;
    font-size: clamp(3rem, 17vmin, 11rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: #F2E9FF;
    /* The one flourish. Two tones of the hint violet, which is the only colour in this game that
       belongs to nothing on the board — so the title borrows nothing it would have to give back. */
    background: linear-gradient(160deg, #F2E9FF 0%, #B79BE8 55%, #7A4FBF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  /* ⚠️ The gradient is a decoration and must never be the text. If `background-clip: text` is not
     supported the fill above would render nothing at all, so the plain colour is restored here for
     anything that cannot do it — a blank title screen is not a graceful degradation. */
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    #splash-title { background: none; -webkit-text-fill-color: #F2E9FF; }
  }
  #splash-by {
    margin: 0;
    font-size: clamp(0.95rem, 3.2vmin, 1.6rem);
    font-weight: 500;
    color: #b9c4d0;
  }
  #splash-status {
    margin: 1.6em 0 0;
    min-height: 1.4em;
    font-size: clamp(0.85rem, 2.4vmin, 1.05rem);
    color: #A0ABB5;
  }
  /*
   * Bigger than the 44 px floor, because it is the only control on the screen and the first thing
   * a child touches. Nothing here depends on hover: the focus ring is the platform's own, widened.
   */
  #splash-progress[hidden] { display: none; }
  #splash-progress {
    width: min(22rem, 70vw);
    height: 0.6rem;
    /* Native bars are wildly different per platform; these two make it one thing everywhere. */
    appearance: none;
    border: 1px solid #B79BE8;
    border-radius: 999px;
    background: #1C1230;
    overflow: hidden;
  }
  #splash-progress::-webkit-progress-bar { background: #1C1230; }
  #splash-progress::-webkit-progress-value { background: #B79BE8; }
  #splash-progress::-moz-progress-bar { background: #B79BE8; }
  #splash-doors[hidden] { display: none; }
  #splash-doors { display: flex; gap: 0.6em; flex-wrap: wrap; justify-content: center; margin: 0; }
  #splash-play, #splash-learn {
    margin-top: 0.4em;
    min-height: 3.2em;
    min-width: 11em;
    font: inherit;
    font-size: clamp(1rem, 3vmin, 1.4rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #14202b;
    background: #B79BE8;
    border: 2px solid #F2E9FF;
    border-radius: 3px;
    cursor: pointer;
  }
  #splash-play:hover, #splash-learn:hover { background: #CDBAF0; }
  #splash-play:focus-visible, #splash-learn:focus-visible {
    outline: 4px solid #FFD97D; outline-offset: 3px;
  }
  /* LEARN is offered as an equal, not as a secondary: a child who came to learn is not a
     fallback case. Different fill so the two are told apart by more than their words. */
  #splash-learn { color: #F2EEE4; background: transparent; border: 2px solid #F2EEE4; }
</style>
</head>
<body>

<!-- ========================= THE TITLE SCREEN =========================
     ⚠️ WRITTEN HERE, not built by the bundle, and that is the entire point of it. This screen
     exists because the opponent is a 6.98 MB WebAssembly download and a board that looks ready
     and will not answer is worse than a wait. A splash that had to boot in order to say
     "loading" would show the board first — the very lie it is here to prevent — so it is in the
     document, painting on the first frame, and the script only takes it away.

     START is absent until there is something to play. There is no percentage, because nothing in
     the load reports one; the button appearing IS the indicator. -->
<div id="splash" role="dialog" aria-modal="true" aria-labelledby="splash-title">
  <h1 id="splash-title">WebChess</h1>
  <p id="splash-by">by prof. Jos&eacute; Rocha</p>
  <p id="splash-status" role="status" aria-live="polite"></p>
  <!--
    ⚠️ TWO DOORS, NOT ONE START. "START" asked a child to begin something without saying what;
    a title screen that offers PLAY and LEARN says there are two things here and lets somebody
    who came to learn arrive at a lesson rather than at a game they must then find their way out
    of. Both are hidden until the engine is ready, and one of them takes focus then.
  -->
  <!--
    ⚠️ IN THE FOOTER AND BELOW THE STATUS LINE, because it is the SECOND channel. The percentage
    goes into `#splash-status`, which is already a live region — a `<progress>` announces its value
    to a screen reader only when asked, so on its own it would be a number nobody hears.
  -->
  <progress id="splash-progress" max="1" value="0"></progress>
  <p id="splash-doors" hidden>
    <button id="splash-play" type="button">JOGAR</button>
    <button id="splash-learn" type="button">APRENDER</button>
  </p>
</div>

<!-- MARCACAO EXIGIDA by createGame: #game-region, #sr-status, #sr-alert.
     Anything missing does not throw — it becomes an entry in engine.problems. -->
<div id="stage-wrap">
  <!--
    ⚠️ `#game-region` IS THE WHOLE GAME — THE BOARD AND THE PANEL BESIDE IT. It used to be only the
    board, with `#stage` wrapped around the pair, and the Dev settled it on 2026-09-11: the board
    plus the side menu ARE the game region. The stage element is gone; this one took its place and
    its id.

    Three things fall out of that, and each one was wrong before:

      · IT IS THE CARTRIDGE'S ROOT. `cartridge-contract.md` gives a cartridge one element and says
        it «may write inside it and nothing outside it». Chess wrote into three — the board, the
        column, and beside the wrap — because its region was only a ninth of what it draws.
      · IT IS WHAT `world()` NAMES, and now the region and the world are the same element again.
        They had to be split when the panel moved out of the board, because a blindness that blanked
        the board and left the move list readable simulates nothing.
      · IT IS WHAT THE TITLE SCREEN MAKES `inert`. Measured on the running page before this changed:
        with the splash up, the board was inert and the panel was not, so Tab reached 22 controls
        behind a screen covering them.

    Inside, the split that the 16x9 stage specifies: nine units of board — a perfect square, an exact
    integer multiple of the raster, which is what keeps the pixel art whole — and seven of panel.
  -->
  <!--
    ⚠️ `#title-icons` WAS THE ENGINE'S QUICK ACCESSIBILITY BAR AND IT IS GONE (2026-10-04).
    The Dev asked for it out; `game-shell.ts` carries the tombstone with the twelve buttons it
    held and what each of them now owes a new door. The element is removed rather than left empty
    because the engine looks for this id by name and would mount the bar into it again.
  -->
  <div id="game-region">
    <div id="chess-board" tabindex="0"></div>
    <div id="side-column"></div>
  </div>
</div>

<!-- The keyboard hint strip was adopted into `.chess-pause` and died with it in Wave 2b.
     The engine's remap screen (reached from the pause card) is the keyboard reference now. -->

<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="sr-alert"  class="sr-only" role="alert"  aria-live="assertive"></div>

<!-- Empty host where installCvdFilters builds the six colour-vision filters at runtime. -->
<svg id="cvd" class="sr-only" aria-hidden="true"></svg>

<script type="module" src="./js/boot/main.ts"></script>
</body>
</html>
