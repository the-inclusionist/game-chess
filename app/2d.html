<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez 2D</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #05070f;
    color: #c9d1d9;
    font: 14px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /*
   * The engine's ui/layout measures THIS element and sizes #game-region from it, locking the
   * scale to whole PHYSICAL pixels so scanlines stay regular at any device pixel ratio.
   */
  #stage-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The region the engine listens to. Keyboard is bound HERE, never on window. */
  #game-region {
    position: relative;
    outline-offset: 4px;
  }
  #game-region:focus-visible { outline: 3px solid #FFD97D; }

  /*
   * The canvas fills whatever ui/layout sized #game-region to. Setting a width here WITHOUT a
   * matching height is what stretched the board: `max-width: 100vw` clipped the width to 721px
   * while the height stayed 720, giving 2.25x across and 4x down.
   */
  #board-canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* PixiJS used to paint this as the Application's backgroundColor. Zdog CLEARS its canvas to
       transparent, so without this the board would float on whatever is behind it. */
    background: #05070f;
    image-rendering: pixelated;
    touch-action: none;   /* the camera owns the drag */
    cursor: grab;
  }
  #board-canvas:active { cursor: grabbing; }

  /*
   * The panel sits over the column the board leaves clear: 88 of the 320 logical pixels, which
   * is 27.5% however the region is scaled. Sizes come from the engine's own --ui-fs and --tap,
   * so the HUD grows with the board instead of drifting away from it.
   */
  .hud {
    position: absolute;
    inset: 0 0 0 auto;
    width: 27.5%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: calc(var(--ui-fs, 16px) * 0.35);
    padding: calc(var(--ui-fs, 16px) * 0.3);
    font-size: var(--ui-fs, 16px);
    line-height: 1.25;
    color: #c9d1d9;
    background: #111a24;
    border-left: 1px solid #2b3a4a;

    /* ========================= THE PANEL SCROLLS =========================
       It used to be `overflow: hidden`, on the assumption that the move list was the only thing
       that could grow and that giving IT a scrollbar was enough. Both halves were wrong: the
       controls below the list are taller than the column at the k=2 floor whatever the list does,
       so the outline switch was already clipped on an empty board — and once the list started
       filling, it pushed the difficulty select out of reach as well. Losing a menu because you
       played twenty moves is a bug, not a layout. */
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  /*
   * The view switcher, at the top of the panel. Three targets across an 88-logical-pixel column,
   * so --tap keeps each one 44 CSS px tall (WCAG 2.5.5) and they split the width, which is the
   * dimension there is none of. The current one is filled rather than merely marked, because
   * `aria-current` is for the reader and the fill is for the eye.
   */
  .hud-views { display: flex; gap: 2px; }
  .hud-view {
    flex: 1 1 0;
    min-width: 0;
    min-height: var(--tap, 44px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75em;
    font-weight: 600;
    text-decoration: none;
    color: #c9d1d9;
    background: #1b2733;
    border: 1px solid #2b3a4a;
    border-radius: 2px;
  }
  .hud-view:hover { background: #24344a; }
  .hud-view[aria-current="page"] { background: #FFD97D; color: #14202b; border-color: #FFD97D; }
  .hud-view[aria-disabled="true"] { opacity: 0.4; cursor: default; }
  #game-region[data-contrast="high"] .hud-view {
    color: #FFFFFF; background: #000000; border-color: #FFFFFF;
  }
  #game-region[data-contrast="high"] .hud-view[aria-current="page"] {
    color: #000000; background: #FFFFFF;
  }

  .hud h2 {
    margin: 0; font-size: 0.75em; font-weight: 600;
    color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .hud p { margin: 0; }
  .hud-turn { display: flex; align-items: center; gap: 0.4em; font-weight: 600; }
  .hud-swatch { flex: 0 0 auto; width: 0.8em; height: 0.8em; border: 1px solid #0b0f14; }
  .hud-swatch[data-side="w"] { background: #FFD97D; }
  .hud-swatch[data-side="b"] { background: #3F2B78; }
  .hud-captured { min-height: 1.2em; font-size: 1.05em; letter-spacing: -0.04em; }
  /* Bounded rather than greedy: `flex: 1 1 auto` let the score sheet claim the column and press
     everything under it against the bottom edge. A fixed window of about eight lines keeps the
     recent moves in view and leaves the controls where the player last saw them; the rest of the
     game is one scroll away, inside the list. */
  .hud-moves {
    flex: 0 0 auto; max-height: 8.5em; overflow-y: auto; overscroll-behavior: contain;
    margin: 0; padding-left: 1.7em; font-size: 0.9em;
    font-variant-numeric: tabular-nums;
  }
  .hud-moves:focus-visible { outline: 2px solid #FFD97D; outline-offset: 1px; }

  /* Two targets side by side in an 88-logical-pixel column: --tap keeps each at 44 CSS px tall
     (WCAG 2.5.5) and they split the width, which is the one dimension there is none of. */
  .hud-nav { display: flex; gap: 0.3em; }
  .hud-nav button {
    flex: 1 1 0; min-width: 0; min-height: var(--tap, 44px);
    display: flex; align-items: center; justify-content: center; gap: 0.2em;
    font: inherit; font-size: 0.75em;
    color: #c9d1d9; background: #1b2733;
    border: 1px solid #2b3a4a; border-radius: 2px;
    cursor: pointer;
  }
  .hud-nav button:hover:not(:disabled) { background: #24344a; }
  .hud-nav button:disabled { opacity: 0.45; cursor: default; }
  .hud-nav-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hud label { display: block; font-size: 0.75em; color: #8b949e; }
  /* --tap is 22*k, which is 44px at the k=2 floor: the WCAG 2.5.5 target size, inherited. */
  /* --tap is 22*k, which is 44px at the k=2 floor: the WCAG 2.5.5 target size, inherited.
     The font shrinks but the TARGET does not — "Correção deuteranopia" has to fit in 176px
     without the control becoming harder to hit. */
  .hud select {
    width: 100%; min-height: var(--tap, 44px);
    font: inherit; font-size: 0.8em;
    text-overflow: ellipsis;
  }

  .hud-check { display: inline; font-size: 0.8em; color: #c9d1d9; margin-left: 0.4em; }
  .hud input[type="checkbox"] {
    width: calc(var(--tap, 44px) * 0.4); height: calc(var(--tap, 44px) * 0.4);
    vertical-align: middle; accent-color: #FFD97D;
  }

  /* The panel switches with the board: same surface, same eye. */
  #game-region[data-contrast="high"] .hud {
    background: #000000; color: #FFFFFF; border-left-color: #FFFFFF;
  }
  #game-region[data-contrast="high"] .hud h2,
  #game-region[data-contrast="high"] .hud label { color: #FFFFFF; }
  #game-region[data-contrast="high"] .hud-nav button {
    color: #FFFFFF; background: #000000; border-color: #FFFFFF;
  }
  #game-region[data-contrast="high"] .hud-swatch[data-side="w"] { background: #FFFFFF; }
  #game-region[data-contrast="high"] .hud-swatch[data-side="b"] { background: #000000; border-color: #FFFFFF; }

  /*
   * The board coordinates. Real DOM text over the canvas, because Zdog has no text primitive —
   * see ui/coordinates.ts for why that is a gain rather than a workaround.
   *
   * `pointer-events: none` matters: the letters sit ON the board, and the board is dragged to turn
   * the camera. A label that swallowed a pointerdown would put a dead spot on the very edge a
   * player reaches for.
   */
  .coords {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-size: calc(var(--ui-fs, 16px) * 0.62);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #6f6552;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  }
  .coords-label {
    position: absolute;
    top: 0;
    left: 0;
    line-height: 1;
    will-change: transform;
  }
  #game-region[data-contrast="high"] .coords { color: #FFFFFF; text-shadow: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  kbd { font: inherit; border: 1px solid #30363d; border-radius: 3px; padding: 0 4px; }
  p.hint { color: #6e7681; margin: 0; padding: 10px; text-align: center; font-size: 12px; flex: 0 0 auto; }

  /*
   * ========================= THE 2D BOARD =========================
   * The grid mirror with its `sr-only` taken off. Eight rows of eight real buttons, so everything
   * that made it work for a screen reader — roving tabindex, aria-selected, arrows clamped at the
   * edges, one funnel to onActivate — is what makes it work for a pointer too.
   *
   * Sized in `em` off --ui-fs so the whole board grows with the engine's own type scale, which is
   * what a low-vision reader is already adjusting.
   */
  .board-2d {
    display: grid;
    grid-template-rows: repeat(8, 1fr);
    width: calc(var(--ui-fs, 16px) * 17.5);
    max-width: 68%;
    aspect-ratio: 1;
    margin: calc(var(--ui-fs, 16px) * 0.8);
    border: 2px solid #3a2a14;
    box-sizing: border-box;
  }
  .board-2d [role="row"] { display: grid; grid-template-columns: repeat(8, 1fr); }

  .board-2d [role="gridcell"] {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    font: inherit;
    line-height: 1;
    cursor: pointer;
  }
  /* From `ui/board-themes.ts`: Wikipedia's diagram colours or XBoard's, by name and by value. */
  .board-2d [role="gridcell"][data-shade="light"] { background: var(--square-light, #ffce9e); }
  .board-2d [role="gridcell"][data-shade="dark"]  { background: var(--square-dark, #d18b47); }
  .board-2d [role="gridcell"]:focus-visible {
    outline: 3px solid #0E7C86;
    outline-offset: -3px;
    z-index: 2;
  }
  .board-2d [role="gridcell"][aria-selected="true"] { box-shadow: inset 0 0 0 3px #1B4F8A; }

  /*
   * Never colour alone (WCAG 1.4.1). A legal move is a DOT, a capture is a RING, and both squares
   * also say so in their label — "lance possível", "captura possível". The shape is the signal;
   * the colour only makes it easier to find.
   */
  .board-2d [role="gridcell"][data-mark]::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
  }
  .board-2d [role="gridcell"][data-mark="move"]::after {
    width: 26%; height: 26%; background: #2E7D5B;
  }
  .board-2d [role="gridcell"][data-mark="capture"]::after {
    width: 78%; height: 78%; border: 3px solid #B3341F;
  }
  .board-2d [role="gridcell"][data-check] { background: #B3341F; }

  /*
   * ========================= A SILHOUETTE BEHIND THE PIECE =========================
   * The 1px stroke is right INSIDE a piece — it separates the crown from the collar and the horse
   * from its base — and too weak AROUND it: against a board of similar tone the piece has no edge,
   * only its own fill ending. What it needs outside is one heavy unbroken line, and what it needs
   * inside is the thin one. Those are different jobs, so they are two draws.
   *
   * `::before` repeats the glyph from `data-glyph` with a much heavier stroke, behind the real one.
   * `isolation: isolate` makes `.cell-piece` a stacking context, so `z-index: -1` puts the copy
   * behind the glyph and still in FRONT of the square — which is the whole trick.
   *
   * ⚠️ THE RIM IS DARK FOR BOTH SIDES, and the arithmetic forces it. A rim has to clear 3:1
   * against BOTH squares to be an edge at all: against Wikipedia's #ffce9e and #d18b47 that means
   * luminance at or below 0.075, so near-black — a light rim would need luminance above 2.1, which
   * does not exist. A dark rim gives 14.57 against the light square and 7.50 against the dark. It
   * is invisible against a black piece's own fill, and that does not matter: what it is edging is
   * the BOARD.
   */
  .cell-piece {
    position: relative;
    isolation: isolate;
    font-family: var(--piece-font, serif);
    font-size: calc(var(--ui-fs, 16px) * 1.5);
    line-height: 1;
    user-select: none;
  }
  .board-2d:not([data-coloured="true"]) .cell-piece[data-glyph]::before {
    content: attr(data-glyph);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    color: var(--piece-halo, #17110a);
    pointer-events: none;

    /*
     * ⚠️ NOT `-webkit-text-stroke`, and the reason is the one an illustrator knows by hand: a
     * stroke joins its segments with a MITRE, and a mitre at an acute angle runs out to a spike.
     * A knight's ear and a crown's points are exactly those angles, so a heavy text-stroke grew
     * thorns off the silhouette. CSS has no `stroke-linejoin` for text to round them off with.
     *
     * So the rim is a DILATION instead: the same glyph drawn at twelve angles around a circle,
     * each copy hard (zero blur) and in the rim colour. The union of a shape with copies of itself
     * displaced around a circle is that shape grown by the radius, with round corners by
     * construction — there is no join to mitre. Twelve steps is 30° apart, which at this radius
     * leaves no scallop the eye can find.
     *
     * The radius is in `em`, so it grows with the piece when a reader enlarges the type.
     */
    --rim: 0.085em;
    --rim-far: calc(var(--rim) * 0.866);
    --rim-near: calc(var(--rim) * 0.5);
    text-shadow:
      var(--rim) 0 0 var(--piece-halo, #17110a),
      var(--rim-far) var(--rim-near) 0 var(--piece-halo, #17110a),
      var(--rim-near) var(--rim-far) 0 var(--piece-halo, #17110a),
      0 var(--rim) 0 var(--piece-halo, #17110a),
      calc(var(--rim-near) * -1) var(--rim-far) 0 var(--piece-halo, #17110a),
      calc(var(--rim-far) * -1) var(--rim-near) 0 var(--piece-halo, #17110a),
      calc(var(--rim) * -1) 0 0 var(--piece-halo, #17110a),
      calc(var(--rim-far) * -1) calc(var(--rim-near) * -1) 0 var(--piece-halo, #17110a),
      calc(var(--rim-near) * -1) calc(var(--rim-far) * -1) 0 var(--piece-halo, #17110a),
      0 calc(var(--rim) * -1) 0 var(--piece-halo, #17110a),
      var(--rim-near) calc(var(--rim-far) * -1) 0 var(--piece-halo, #17110a),
      var(--rim-far) calc(var(--rim-near) * -1) 0 var(--piece-halo, #17110a);
  }
  /*
   * White and black with the opposite ink around them — the convention every printed diagram and
   * every 2D interface uses, and the one a learner has already met. ⚠️ Measured in
   * `ui/board-themes.ts`: a white piece's FILL clears 3:1 against neither square in either
   * standard. What identifies it is the black outline, at 14.57 against a light Wikipedia square —
   * which is why the stroke here is a real rim and not a hairline.
   */
  .board-2d:not([data-coloured="true"]) .cell-piece[data-side="w"] {
    color: #FFFFFF; -webkit-text-stroke: 1px #000000; paint-order: stroke fill;
  }
  .board-2d:not([data-coloured="true"]) .cell-piece[data-side="b"] {
    color: #000000; -webkit-text-stroke: 1px #FFFFFF; paint-order: stroke fill;
  }

  /* ⚠️ A coloured set paints its own pixels and cannot be tinted, so the SIDE moves to a disc
     behind it — which is how a physical set does it too: same shape, different material. */
  .board-2d[data-coloured="true"] .cell-piece {
    width: 82%; height: 82%;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    box-sizing: border-box;
  }
  .board-2d[data-coloured="true"] .cell-piece[data-side="w"] { background: #FFFFFF; border: 2px solid #000000; }
  .board-2d[data-coloured="true"] .cell-piece[data-side="b"] { background: #000000; border: 2px solid #FFFFFF; }

  /*
   * The coordinates. On a flat board they need no projection at all: the file letter belongs in
   * the bottom row and the rank number in the first column, which is a corner of a cell rather
   * than a point that has to be extrapolated from a camera. `ui/coordinates` exists because Zdog
   * has no text primitive; here the cells are text already.
   */
  /*
   * The travelling piece. Position: fixed against the viewport, because it has to cross cells and
   * a cell is `overflow` clipped by nothing but is still a grid item — a child of one cell cannot
   * be drawn over another. Removed the moment it lands.
   */
  .cell-flight {
    position: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
    font-family: var(--piece-font, serif);
    line-height: 1;
  }

  .board-2d [role="gridcell"] .cell-coord {
    position: absolute;
    font-size: calc(var(--ui-fs, 16px) * 0.5);
    font-weight: 700;
    /* Dark on both standards' squares: 14.57 and 11.45 against the light ones, 7.50 and 7.17
       against the dark. One ink reads on all four. */
    color: #3a2a14;
    pointer-events: none;
  }
  .board-2d [role="gridcell"] .cell-coord[data-kind="file"] { right: 3%; bottom: 1%; }
  .board-2d [role="gridcell"] .cell-coord[data-kind="rank"] { left: 4%; top: 1%; }
  #game-region:not([data-coords="on"]) .cell-coord { display: none; }

  /* High contrast: the same numeric solution the 3D board uses, applied to a flat one. */
  #game-region[data-contrast="high"] .board-2d { border-color: #FFFFFF; }
  #game-region[data-contrast="high"] .board-2d [role="gridcell"][data-shade="light"] { background: #8F8F8F; }
  #game-region[data-contrast="high"] .board-2d [role="gridcell"][data-shade="dark"]  { background: #5A5A5A; }
  /*
   * ⚠️ THE PIECES DO NOT CHANGE HERE, and that is the finding rather than an omission. These rules
   * used to import the 3D high-contrast palette — yellow #FFFF00 and black under a #0099FF rim —
   * which was solved for SOLIDS whose faces catch light, and which had no business on a glyph.
   *
   * A flat board's default already uses the two extreme inks, so high contrast has nothing left to
   * do to the pieces; the whole of its work is the BOARD. Measured on the grey pair below:
   *
   *              vs light   vs dark          against the tan default it replaces
   *   white        3.23       6.90           white on light was 1.44
   *   black        6.49       3.04           black on light was 14.57
   *   piece against piece  21.00             square against square  2.13
   *
   * All four pairs clear 3:1 — which the default board cannot do and does not claim to, because
   * there the white piece is carried by its outline. Stated explicitly rather than left to
   * inheritance, so that changing the default cannot silently change this.
   */
  #game-region[data-contrast="high"] .cell-piece[data-side="w"] { color: #FFFFFF; -webkit-text-stroke: 1px #000000; }
  #game-region[data-contrast="high"] .cell-piece[data-side="b"] { color: #000000; -webkit-text-stroke: 1px #FFFFFF; }
  #game-region[data-contrast="high"] .cell-coord { color: #FFFFFF; }
  /* 3.04 against the darker grey and 6.49 against the lighter — an edge on both. */
  #game-region[data-contrast="high"] .board-2d { --piece-halo: #000000; }
</style>
</head>
<body>

<!-- MARCACAO EXIGIDA by createGame: #game-region, #sr-status, #sr-alert.
     Anything missing does not throw — it becomes an entry in engine.problems. -->
<div id="stage-wrap">
  <div id="game-region" tabindex="0"></div>
</div>

<p class="hint">
  Setas navegam o tabuleiro &middot; Enter seleciona &middot; <kbd>K</kbd> sonar
</p>

<div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
<div id="sr-alert"  class="sr-only" role="alert"  aria-live="assertive"></div>

<!-- Empty host where installCvdFilters builds the six colour-vision filters at runtime. -->
<svg id="cvd" class="sr-only" aria-hidden="true"></svg>

<script type="module" src="./js/boot/main-2d.ts"></script>
</body>
</html>
